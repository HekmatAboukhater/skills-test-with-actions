name: Python Coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  python-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coverage dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 coverage==7.9.0 pytest-cov==6.2.1
      - name: Run tests and require 90% coverage
        id: coverage
        shell: bash
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=90 | tee pytest-coverage.txt
      - name: Report coverage on the pull request
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            printf '%s\n' '### Python coverage' '' '```text'
            cat pytest-coverage.txt
            printf '%s\n' '```'
          } > coverage-comment.md
          gh pr comment "$PR_URL" --body-file coverage-comment.md --edit-last --create-if-none
